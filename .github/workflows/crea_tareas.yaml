name: Crear sub-issues backend (Java MVC)

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      parent_id:
        description: "Número del issue padre (ej: 15)"
        required: true
      model:
        description: "Nombre del modelo (ej: Producto)"
        required: true
      subtasks:
        description: "Subtareas personalizadas (opcional)"
        required: false
        default: "modelo,repository,service,controller,dto,tests"

jobs:
  create_backend_subissues:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Crear sub-issues backend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PARENT: ${{ github.event.inputs.parent_id }}
          MODEL: ${{ github.event.inputs.model }}
          SUBTASKS: ${{ github.event.inputs.subtasks }}
        run: |
          IFS=',' read -ra TASKS <<< "$SUBTASKS"
          echo "Creando subtareas backend para $MODEL (#$PARENT)..."

          for TASK in "${TASKS[@]}"; do
            TITLE="Crear ${TASK} de ${MODEL}"

            BODY="Sub-issue backend para #$PARENT

Modelo: $MODEL
Tipo: $TASK

Checklist sugerido:
- [ ] Implementación básica
- [ ] Validaciones
- [ ] Integración con capas relacionadas
- [ ] Tests básicos"

            OUTPUT=$(gh issue create \
              --repo "$REPO" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "backend,$TASK")

            ISSUE_NUMBER=$(echo "$OUTPUT" | grep -oE '#[0-9]+' | head -1 | tr -d '#')

            gh issue comment $PARENT --body "- [ ] #$ISSUE_NUMBER $TITLE"
          done
