name: Crear feature backend completo (Java MVC)

permissions:
  contents: write
  issues: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Nombre del feature/modelo (ej: Roles)"
        required: true

jobs:
  create_backend_feature:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Crear feature + sub-issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          echo "Creando feature completa para $MODEL..."

          # 1. Crear issue padre
          PARENT_OUTPUT=$(gh issue create \
            --repo "$REPO" \
            --title "$MODEL" \
            --body "Feature backend para $MODEL" \
            --label "backend,feature")

          PARENT_NUMBER=$(echo "$PARENT_OUTPUT" | grep -oE '#[0-9]+' | head -1 | tr -d '#')

          echo "Issue padre creado: #$PARENT_NUMBER"

          # 2. Definir tareas fijas
          TASKS=("modelo" "repository" "service" "controller" "dto" "tests")

          # 3. Crear sub-issues
          for TASK in "${TASKS[@]}"; do
            TITLE="[${MODEL}] Crear ${TASK}"

            BODY="Sub-issue de #$PARENT_NUMBER

Entidad: $MODEL
Capa: $TASK"

            OUTPUT=$(gh issue create \
              --repo "$REPO" \
              --title "$TITLE" \
              --body "$BODY" \
              --label "backend,$TASK")

            ISSUE_NUMBER=$(echo "$OUTPUT" | grep -oE '#[0-9]+' | head -1 | tr -d '#')

            gh issue comment $PARENT_NUMBER --body "- [ ] #$ISSUE_NUMBER $TITLE"
          done
